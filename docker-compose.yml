services:
  myzap:
    build:
      context: .
      target: prod
    image: myzap:latest
    container_name: myzap
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 3333
    ports:
      - "${PORT:-3333}:3333"
    volumes:
      - myzap_tokens:/usr/src/app/tokens
      - myzap_data:/usr/src/app/data
    shm_size: 1gb
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      backend:
        aliases:
          - myzap

  myzap-dev:
    profiles: [dev]
    build:
      context: .
      target: dev
    container_name: myzap-dev
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 3333
    ports:
      - "${PORT:-3333}:3333"
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    shm_size: 1gb
    stdin_open: true
    tty: true
    networks:
      backend:
        aliases:
          - myzap-dev

volumes:
  myzap_tokens:
  myzap_data:

networks:
  backend:
    name: myzapnetwork
