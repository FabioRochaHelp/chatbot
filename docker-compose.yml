services:
  conectzap:
    build:
      context: .
      target: prod
    image: conectzap:latest
    container_name: conectzap
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 3333
    ports:
      - "${PORT:-3333}:3333"
    volumes:
      - myzap_tokens:/usr/src/app/tokens
      - myzap_data:/usr/src/app/data
    shm_size: 1gb
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      backend:
        aliases:
          - conectzap

  conectzap-dev:
    profiles: [dev]
    build:
      context: .
      target: dev
    container_name: conectzap-dev
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 3333
    ports:
      - "${PORT:-3333}:3333"
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    shm_size: 1gb
    stdin_open: true
    tty: true
    networks:
      backend:
        aliases:
          - conectzap-dev

# os volumes mantêm o nome de quando o app se chamava MyZap:
# renomear criaria volumes vazios (perderia o login do WhatsApp e o banco)
volumes:
  myzap_tokens:
  myzap_data:

networks:
  backend:
    name: conectzapnetwork
